<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" type="text/css" href="./css.css">

    <title>Parking Payment</title>
</head>

<body>



    <div class="input-box">

        <img class="icon" src="./Icon.jpg">
        <h2>Parking Payment</h2>

        <div class="parking-info">

            <p>
                <strong>Plate:</strong>
                <span id="displayPlate"></span>
            </p>

            <p>
                <strong>Name:</strong>
                <span id="displayName"></span>
            </p>

            <p>
                <strong>Contact:</strong>
                <span id="displayContact"></span>
            </p>

            <p>
                <strong>Entry Time:</strong>
                <span id="displayEntry"></span>
            </p>

            <p>
                <strong>Exit Time:</strong>
                <span id="displayExit"></span>
            </p>

            <p>
                <strong>Parking Duration:</strong>
                <span id="displayDuration"></span>
            </p>

            <h3>
                Amount to Pay:
                <span id="displayAmount"></span>
            </h3>

            <button class="checkButton" id="confirmExit">
                Confirm Exit
            </button>

        </div>

    </div>

    <script src="./payment.js"></script>

</body>

</html>
